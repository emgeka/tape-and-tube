[package]
name = "tapetube-core-probe"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Isolated processing-core experiment for Tape & Tube"
publish = false

[dependencies]
ntscrt-engine = { path = "../engine-adapter" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
